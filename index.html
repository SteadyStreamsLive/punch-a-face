<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Punch-a-Face Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one arcade screen — marquee bar, boxing-ring canvas, control deck */
:root{
  --ink:#0d0b1f;
  --ring:#1a1640;
  --rope:#e63946;
  --gold:#ffc93c;
  --cream:#fdf3e1;
  --mute:#8e88c2;
  --display:"Bungee","Impact","Arial Black",sans-serif;
  --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--body);display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,4.5vw,34px);margin:0;letter-spacing:.02em;color:var(--gold);text-shadow:3px 3px 0 var(--rope)}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;align-items:flex-end}
.stat b{font-family:var(--display);font-weight:400;font-size:clamp(18px,3.5vw,26px);line-height:1}
.stat span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
#stage{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:var(--ring);
  box-shadow:inset 0 0 0 4px var(--rope),inset 0 0 0 9px var(--cream),inset 0 0 0 13px #3a5bd9;cursor:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
.deck{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font-family:var(--display);font-size:15px;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;
  background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #b8861a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8861a}
.btn.alt{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px var(--mute)}
.btn:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.hint{color:var(--mute);font-size:13px;flex:1;min-width:180px}
#file{display:none}
[hidden]{display:none!important}
#drop{pointer-events:none;position:absolute;inset:0;display:grid;place-items:center;background:rgba(13,11,31,.8);font-family:var(--display);font-size:24px;color:var(--gold)}
@media (max-width:520px){.hint{display:none}.btn{flex:1}}
</style>
</head>
<body>

<header>
  <h1>PUNCH-A-FACE</h1>
  <div class="stats">
    <div class="stat"><b id="sPunch">0</b><span>Punches</span></div>
    <div class="stat"><b id="sCombo">0</b><span>Combo</span></div>
    <div class="stat"><b id="sBest">0</b><span>Best</span></div>
  </div>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="drop" hidden>DROP THE PHOTO</div>
</div>

<div class="deck">
  <label class="btn" for="file" tabindex="0" id="loadBtn">Load photo</label>
  <input type="file" id="file" accept="image/*">
  <button class="btn alt" id="heal">Heal</button>
  <button class="btn alt" id="snd">Sound: on</button>
  <span class="hint">Click or tap the face to throw a punch. Space bar works too. Drag a photo in, or paste one.</span>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);const r=stage.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
new ResizeObserver(resize).observe(stage);resize();

// ---------- face source ----------
const FS=512;
const face=document.createElement('canvas');face.width=face.height=FS;const fctx=face.getContext('2d');
function drawDummy(){
  const g=fctx;g.clearRect(0,0,FS,FS);
  const bg=g.createRadialGradient(256,230,40,256,256,330);bg.addColorStop(0,'#ffd9a8');bg.addColorStop(1,'#e8a86a');
  g.fillStyle=bg;g.beginPath();g.ellipse(256,270,200,230,0,0,Math.PI*2);g.fill();
  g.fillStyle='#3b2416';g.beginPath();g.ellipse(256,110,190,90,0,Math.PI,0);g.fill();
  g.fillStyle='#fff';[180,332].forEach(x=>{g.beginPath();g.ellipse(x,240,34,26,0,0,7);g.fill()});
  g.fillStyle='#1a1640';[186,326].forEach(x=>{g.beginPath();g.arc(x,244,14,0,7);g.fill()});
  g.strokeStyle='#3b2416';g.lineWidth=10;g.lineCap='round';
  g.beginPath();g.moveTo(140,195);g.lineTo(215,205);g.moveTo(372,195);g.lineTo(297,205);g.stroke();
  g.fillStyle='#d98b55';g.beginPath();g.ellipse(256,300,22,30,0,0,7);g.fill();
  g.strokeStyle='#7a2e22';g.lineWidth=9;g.beginPath();g.arc(256,360,60,.15*Math.PI,.85*Math.PI);g.stroke();
  g.fillStyle='rgba(13,11,31,.75)';g.fillRect(156,450,200,44);
  g.fillStyle='#ffc93c';g.font='22px Bungee, Impact, sans-serif';g.textAlign='center';g.fillText('YOUR FACE HERE',256,480);
}
drawDummy();
document.fonts&&document.fonts.ready.then(()=>{if(!hasPhoto)drawDummy()});
let hasPhoto=false;
function loadFile(f){
  if(!f||!f.type.startsWith('image/'))return;
  const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{drop.hidden=true;const s=Math.min(img.width,img.height);fctx.clearRect(0,0,FS,FS);
    fctx.save();fctx.beginPath();fctx.ellipse(256,256,248,256,0,0,7);fctx.clip();
    fctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,FS,FS);fctx.restore();
    hasPhoto=true;heal();URL.revokeObjectURL(url)};
  img.src=url;
}
document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);
document.getElementById('loadBtn').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();document.getElementById('file').click()}};
const drop=document.getElementById('drop');
stage.addEventListener('dragover',e=>{e.preventDefault();drop.hidden=false});
stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))drop.hidden=true});
stage.addEventListener('drop',e=>{e.preventDefault();drop.hidden=true;loadFile(e.dataTransfer.files[0])});
window.addEventListener('paste',e=>{for(const it of e.clipboardData.items){if(it.type.startsWith('image/')){loadFile(it.getAsFile());break}}});

// ---------- sayings (edit this list) ----------
const SAYINGS=[
  "Can I get uhhhhhh",
  "2 SHOT",
  "Go Back, Go Back",
  "Can you hear me?!",
  "Back On",
  "I don't know what that means",
  "Guest Full",
  "Show It",
  "Play It",
  "Prompter",
  "Ahhh, That Was Great"
];
let bubble=null,lastSay=0,sayIdx=-1;
function say(){
  if(!SAYINGS.length)return;
  let i;do{i=Math.random()*SAYINGS.length|0}while(SAYINGS.length>1&&i===sayIdx);
  sayIdx=i;bubble={txt:SAYINGS[i],t:0,life:2.6};lastSay=performance.now();
}
// ---------- state ----------
const S={ox:0,oy:0,vx:0,vy:0,rot:0,vr:0,sq:0,vsq:0,dent:0,vdent:0,dentY:0,dentDir:1,shake:0};
let bruises=[],fx=[],gloves=[],punches=0,combo=0,best=0,lastHit=0,hand=1,mouse={x:-99,y:-99,in:false};
const el=id=>document.getElementById(id);
function heal(){bruises=[];Object.assign(S,{ox:0,oy:0,vx:0,vy:0,rot:0,vr:0,sq:0,vsq:0,dent:0,vdent:0});combo=0;upd()}
el('heal').onclick=heal;
function upd(){el('sPunch').textContent=punches;el('sCombo').textContent=combo;el('sBest').textContent=best}

function faceRect(){const s=Math.min(W*.62,H*.72);return{x:W/2-s/2,y:H/2-s/2+H*.02,s}}

// ---------- audio ----------
let AC=null,soundOn=true;
el('snd').onclick=()=>{soundOn=!soundOn;el('snd').textContent='Sound: '+(soundOn?'on':'off')};
function thump(power,miss){
  if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  const t=AC.currentTime;
  const len=.18,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,miss?6:3);
  const n=AC.createBufferSource();n.buffer=buf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=miss?2500:900+power*900;
  const g=AC.createGain();g.gain.value=miss?.15:.6;n.connect(f).connect(g).connect(AC.destination);n.start(t);
  if(!miss){const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(45,t+.2);
    og.gain.setValueAtTime(.7,t);og.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(og).connect(AC.destination);o.start(t);o.stop(t+.26)}
}

// ---------- punching ----------
function throwPunch(x,y){
  hand*=-1;
  gloves.push({hand,tx:x,ty:y,t:0,hit:false});
}
function land(g){
  const r=faceRect(),cx=r.x+r.s/2,cy=r.y+r.s/2;
  const inside=((g.tx-cx)/(r.s*.5))**2+((g.ty-cy)/(r.s*.52))**2<1;
  if(!inside){thump(0,true);fx.push({type:'text',x:g.tx,y:g.ty,t:0,txt:'WHIFF',col:'#8e88c2'});combo=0;upd();return}
  const now=performance.now();combo=now-lastHit<900?combo+1:1;lastHit=now;best=Math.max(best,combo);punches++;
  const power=Math.min(1,.5+combo*.06);
  const dir=g.hand>0?-1:1; // right hand pushes face left
  const ny=(g.ty-cy)/(r.s/2);
  S.vx+=(cx-g.tx)*.9*power-dir*140*power;S.vy+=(cy-g.ty)*.4*power-40;
  S.vr+=dir*-.9*power*(1+Math.abs(ny));S.vsq+=6*power;
  S.dent=0;S.vdent=90*power;S.dentY=(g.ty-r.y)/r.s;S.dentDir=-dir;S.shake=10*power;
  bruises.push({u:(g.tx-r.x)/r.s,v:(g.ty-r.y)/r.s,a:.55,rad:.07+Math.random()*.05});
  if(bruises.length>40)bruises.shift();
  const words=['POW!','BAM!','WHAM!','BOOM!','SMACK!','KAPOW!'];
  fx.push({type:'text',x:g.tx,y:g.ty-30,t:0,txt:combo>=8?'KNOCKOUT!':words[Math.random()*words.length|0],col:combo>=8?'#e63946':'#ffc93c',big:combo>=8});
  for(let i=0;i<12;i++){const a=Math.random()*7,sp=200+Math.random()*350;fx.push({type:'star',x:g.tx,y:g.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,t:0,c:Math.random()<.5?'#ffc93c':'#fdf3e1'})}
  thump(power,false);upd();
  if((!bubble||bubble.t>1.2)&&Math.random()<.45)say();
}

function pt(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
stage.addEventListener('pointerdown',e=>{const p=pt(e);mouse={...p,in:true};throwPunch(p.x,p.y)});
stage.addEventListener('pointermove',e=>{mouse={...pt(e),in:true}});
stage.addEventListener('pointerleave',()=>mouse.in=false);
window.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();const r=faceRect();
  throwPunch(r.x+r.s*(.3+Math.random()*.4),r.y+r.s*(.3+Math.random()*.45))}});

// ---------- drawing ----------
function drawGlove(x,y,sc,flip,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc*flip,sc);
  // cuff
  ctx.fillStyle='#fdf3e1';ctx.beginPath();ctx.roundRect(-38,40,76,70,12);ctx.fill();
  ctx.strokeStyle='#c9bfa8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-36,62);ctx.lineTo(36,62);ctx.stroke();
  // fist
  const gr=ctx.createRadialGradient(-18,-30,8,0,-5,80);gr.addColorStop(0,'#ff6b6b');gr.addColorStop(.6,'#e63946');gr.addColorStop(1,'#8f1d27');
  ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(-44,48);ctx.bezierCurveTo(-70,10,-60,-70,0,-72);ctx.bezierCurveTo(60,-72,66,0,44,48);ctx.closePath();ctx.fill();
  // thumb
  ctx.fillStyle='#c92d3a';ctx.beginPath();ctx.ellipse(-46,6,18,34,-.35,0,7);ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(-46,6,18,34,-.35,-.5,1.8);ctx.stroke();
  // shine
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.ellipse(-12,-46,20,9,-.3,0,7);ctx.fill();
  ctx.restore();
}

function drawRing(){
  const g=ctx.createRadialGradient(W/2,H*.45,10,W/2,H/2,Math.max(W,H)*.7);
  g.addColorStop(0,'#2b2566');g.addColorStop(1,'#120f2e');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // spotlight
  ctx.fillStyle='rgba(255,201,60,.06)';ctx.beginPath();ctx.moveTo(W*.42,0);ctx.lineTo(W*.58,0);ctx.lineTo(W*.85,H);ctx.lineTo(W*.15,H);ctx.fill();
  // ropes
  [[.2,'#e63946'],[.5,'#fdf3e1'],[.8,'#3a5bd9']].forEach(([f,c],i)=>{ctx.strokeStyle=c;ctx.globalAlpha=.35;ctx.lineWidth=5;
    ctx.beginPath();ctx.moveTo(0,H*f);ctx.quadraticCurveTo(W/2,H*f+14,W,H*f);ctx.stroke()});ctx.globalAlpha=1;
}

function drawFace(){
  const r=faceRect();
  const sh=S.shake>.3?(Math.random()-.5)*S.shake:0;
  ctx.save();
  ctx.translate(r.x+r.s/2+S.ox+sh,r.y+r.s/2+S.oy+sh);ctx.rotate(S.rot);
  const sq=S.sq*.012;ctx.scale(1+sq,1-sq*.8);
  // shadow
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(10,r.s*.5,r.s*.36,r.s*.06,0,0,7);ctx.fill();
  // warped face strips
  const N=64,sh2=r.s/N;
  for(let i=0;i<N;i++){
    const v=(i+.5)/N,dy=v-S.dentY,gs=Math.exp(-(dy*dy)/.02);
    const off=S.dent*gs*S.dentDir;
    ctx.drawImage(face,0,i*FS/N,FS,FS/N+1,-r.s/2+off,-r.s/2+i*sh2,r.s,sh2+1);
  }
  // bruises
  ctx.save();ctx.beginPath();ctx.ellipse(0,0,r.s*.485,r.s*.5,0,0,7);ctx.clip();
  ctx.globalCompositeOperation='multiply';
  for(const b of bruises){const bx=-r.s/2+b.u*r.s,by=-r.s/2+b.v*r.s,rad=b.rad*r.s;
    const g=ctx.createRadialGradient(bx,by,0,bx,by,rad);g.addColorStop(0,`rgba(150,40,90,${b.a})`);g.addColorStop(.6,`rgba(190,60,60,${b.a*.5})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=g;ctx.fillRect(bx-rad,by-rad,rad*2,rad*2)}
  ctx.restore();
  // dizzy stars when combo is high
  if(combo>=5&&performance.now()-lastHit<1500){const t=performance.now()/300;
    for(let k=0;k<4;k++){const a=t+k*Math.PI/2;star(Math.cos(a)*r.s*.35,-r.s*.55+Math.sin(a)*r.s*.06,9,'#ffc93c')}}
  ctx.restore();
}
function drawBubble(){
  if(!bubble)return;const r=faceRect();
  const fs=Math.max(14,Math.min(22,Math.min(W,H)*.04));
  ctx.font=`700 ${fs}px Rubik, system-ui, sans-serif`;
  const maxW=Math.min(W*.42,280),words=bubble.txt.split(' '),lines=[];let line='';
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  lines.push(line);
  const lh=fs*1.25,pad=fs*.7,bw=Math.max(...lines.map(l=>ctx.measureText(l).width))+pad*2,bh=lines.length*lh+pad*1.6;
  const mx=r.x+r.s/2+S.ox+r.s*.12,my=r.y+r.s*.7+S.oy;
  let bx=Math.min(W-bw-12,r.x+r.s*.78+S.ox),by=Math.max(12,r.y+r.s*.02+S.oy);
  if(bx<12)bx=12;
  const p=Math.min(1,bubble.t*7),sc=p<1?.6+.4*(1-Math.pow(1-p,3))*1.05:1;
  const fade=Math.min(1,(bubble.life-bubble.t)*4);
  ctx.save();ctx.globalAlpha=fade;
  ctx.translate(bx+bw*.2,by+bh);ctx.scale(sc,sc);ctx.translate(-(bx+bw*.2),-(by+bh));
  ctx.fillStyle='#fdf3e1';ctx.strokeStyle='#0d0b1f';ctx.lineWidth=4;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,fs*.8);ctx.fill();ctx.stroke();
  const tx=bx+Math.min(bw*.25,40);
  ctx.beginPath();ctx.moveTo(tx,by+bh-2);ctx.lineTo(tx+fs,by+bh-2);ctx.lineTo(mx+(tx-mx)*.35,my+(by+bh-my)*.35);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(tx,by+bh);ctx.lineTo(mx+(tx-mx)*.35,my+(by+bh-my)*.35);ctx.lineTo(tx+fs,by+bh);ctx.stroke();
  ctx.fillStyle='#0d0b1f';ctx.textAlign='left';ctx.textBaseline='middle';
  lines.forEach((l,i)=>ctx.fillText(l,bx+pad,by+pad*.8+lh*i+lh/2));
  ctx.restore();
}
function star(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?s*.45:s;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.fill()}

function step(dt){
  // springs
  const k=170,d=11;
  S.vx+=(-k*S.ox-d*S.vx)*dt;S.ox+=S.vx*dt;
  S.vy+=(-k*S.oy-d*S.vy)*dt;S.oy+=S.vy*dt;
  S.vr+=(-k*S.rot-d*S.vr)*dt;S.rot+=S.vr*dt;
  S.vsq+=(-260*S.sq-12*S.vsq)*dt;S.sq+=S.vsq*dt;
  S.vdent+=(-320*S.dent-13*S.vdent)*dt;S.dent+=S.vdent*dt;
  S.shake*=Math.pow(.02,dt);
  for(const b of bruises)b.a=Math.max(.18,b.a-dt*.01);
  if(combo&&performance.now()-lastHit>1200){combo=0;upd()}
  if(bubble){bubble.t+=dt;if(bubble.t>bubble.life)bubble=null}
  const nowT=performance.now();if(!bubble&&nowT-lastSay>6000&&nowT-lastHit>3000)say();
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;step(dt);
  drawRing();drawFace();drawBubble();
  // effects
  fx=fx.filter(f=>{f.t+=dt;
    if(f.type==='star'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=.9;f.vy*=.9;ctx.globalAlpha=Math.max(0,1-f.t*2.2);star(f.x,f.y,7,f.c);ctx.globalAlpha=1;return f.t<.5}
    const p=Math.min(1,f.t*8),sc=(f.big?1.6:1)*(.5+p*.6),a=Math.max(0,1-Math.max(0,f.t-.4)*2.5);
    ctx.save();ctx.translate(f.x,f.y-f.t*40);ctx.rotate(-.12);ctx.scale(sc,sc);ctx.globalAlpha=a;
    ctx.font=`${Math.max(28,Math.min(W,H)*.07)}px Bungee, Impact, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineWidth=8;ctx.strokeStyle='#0d0b1f';ctx.strokeText(f.txt,0,0);ctx.fillStyle=f.col;ctx.fillText(f.txt,0,0);ctx.restore();
    return f.t<.9});
  // gloves
  const gs=Math.min(W,H)/520;
  gloves=gloves.filter(g=>{g.t+=dt;const T=.22,peak=.09;
    const p=g.t<peak?g.t/peak:Math.max(0,1-(g.t-peak)/(T-peak));
    const e=1-Math.pow(1-p,3);
    const sx=W/2+g.hand*W*.42,sy=H+60*gs;
    const x=sx+(g.tx-sx)*e,y=sy+(g.ty+40*gs-sy)*e;
    if(!g.hit&&g.t>=peak){g.hit=true;land(g)}
    drawGlove(x,y,gs*(1.4-e*.55),g.hand,g.hand*(-.5+e*.4));
    return g.t<T});
  // idle gloves guarding + aim cursor
  if(!gloves.length){const gs2=gs*1.1,bob=Math.sin(now/260)*6;
    drawGlove(W*.12,H*.95+bob,gs2,-1,.35);drawGlove(W*.88,H*.95-bob,gs2,1,-.35)}
  if(mouse.in){ctx.strokeStyle='rgba(255,201,60,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(mouse.x,mouse.y,14,0,7);
    ctx.moveTo(mouse.x-22,mouse.y);ctx.lineTo(mouse.x-8,mouse.y);ctx.moveTo(mouse.x+8,mouse.y);ctx.lineTo(mouse.x+22,mouse.y);
    ctx.moveTo(mouse.x,mouse.y-22);ctx.lineTo(mouse.x,mouse.y-8);ctx.moveTo(mouse.x,mouse.y+8);ctx.lineTo(mouse.x,mouse.y+22);ctx.stroke()}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
